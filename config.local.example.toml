# Copy to config.local.toml and edit locally. This example is not loaded.
# Follow requirements/requirements.md: find/reuse compatible installations first.
# Install only missing requirements for the selected operation; record paths/versions
# in config.local.toml, preserving other settings. Never put them in this example.
# Paths must be absolute; external resources stay outside this checkout except
# the active Python environment's package source described below. On Windows use forward slashes
# (C:/Users/...) or TOML literal strings ('C:\Users\...'). Do not use ~ or $VARS.
[paths]
data_root = "/absolute/path/to/Dropbox/project-data"
# Needed only for operations consuming external resource snapshots. Keep local,
# outside both the checkout and synchronized data root (neither contains the other).
# resource_cache = "/absolute/path/to/local/music-video-resources"
# Keep the cache root short: observed music21 manifests need <=41 characters.

# Required before managed production. Keep the actor label stable across sessions.
# Generate host_id once on each machine with Python: import uuid; print(uuid.uuid4())
# Do not copy another machine's ID or commit this machine-specific configuration.
# [bookkeeping]
# actor_id = "your-collaborator-label"
# host_id = "<machine-stable UUIDv4>"

# Enable only the tools needed for your selected skill. Commands are argv lists,
# never shell strings; use an absolute executable path or a name already on PATH.
# [tools.musescore]
# command = ["/absolute/path/to/MuseScore"]
# version = "<observed version>"
# [tools.audiveris]
# command = ["java", "-jar", "/absolute/path/to/Audiveris.jar"]
# [tools.java]
# command = ["java"]
# [tools.javac]
# command = ["javac"]
# [tools.ffmpeg]
# command = ["ffmpeg"]
# version = "<observed version including build suffix>"
# [tools.ffprobe]
# command = ["ffprobe"]
# [tools.browser]
# command = ["/absolute/path/to/chromium"]
# [tools.rvc]
# command = ["/absolute/path/to/external/python", "/absolute/path/to/RVC/infer.py"]

# Enable only the resources used by your stage. No models or sample data in Git.
# [resources]
# Discover with env/bin/python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
# python_packages = "/absolute/path/to/active/environment/site-packages"
# jjazzlab_toolkit = "/absolute/path/to/jjazzlab-toolkit.jar"
# jjazzlab_rhythms = "/absolute/path/to/rhythms"
# midi_audit = "/absolute/path/to/proven/audit_existing_midi.py"
# fluidsynth_library = "/absolute/path/to/platform/fluidsynth-library"
# soundfont_manifest = "/absolute/path/to/soundfonts/banks.json"
# soundfont_credits = "/absolute/path/to/soundfonts/CREDITS.md"
# nishiren_root = "/absolute/path/to/Nishiren"
# pronunciation_lexicon = "/absolute/path/to/pronunciation.json"
# rvc_model = "/absolute/path/to/voice-model.pth"
# rvc_index = "/absolute/path/to/voice-model.index"

# Add tools.NAME.version for every configured tool. Resource versions/identities
# use the same names as [resources]; omit resources not selected for this workflow.
# [resource_versions]
# python_packages = "<observed Python version; distribution versions recorded per run>"
# fluidsynth_library = "<observed native library version>"
# jjazzlab_toolkit = "<verified release or sha256:digest>"
# soundfont_manifest = "sha256:<digest of manifest recording all bank hashes>"

# Optional pointer used when auditing/updating the original collaborator bundle.
# [provenance]
# skill_source_bundle = "/absolute/path/to/Dropbox/Skills"
